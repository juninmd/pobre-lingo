name: Release Desktop

# Publica o instalador NSIS assinado e o latest.json (auto-update) ao empurrar uma tag v*.
# Segredos: TAURI_SIGNING_PRIVATE_KEY (conteúdo da chave privada do updater).
# A versão vem do tauri.conf.json: mantenha package.json, Cargo.toml e tauri.conf.json iguais
# e crie a tag correspondente (ex.: v0.2.0).

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build and publish
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: "Pobre Lingo ${{ github.ref_name }}"
        releaseBody: "Instalador para Windows. O app instalado se atualiza sozinho (Ajustes > Atualizações)."
        releaseDraft: false
        prerelease: false
