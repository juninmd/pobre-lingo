# Netlify Configuration
# Single Page Application (SPA) redirect rule
# This ensures that all paths are routed to index.html so React Router can handle them.

[build]
  command = "pnpm run build"
  publish = "dist"

# Redirects are now handled via _redirects file in public/ (which is copied to dist/)
# But we can also define them here for clarity and backup.
# Netlify processes both. To avoid "Redirect rules" check failure due to potential conflict or processing order,
# we will stick to a minimal config here.

# Note: The presence of public/_redirects is usually sufficient for SPAs on Netlify.
# However, specifying the build command and publish directory is good practice.
