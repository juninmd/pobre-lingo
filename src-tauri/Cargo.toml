[package]
name = "pobre-lingo"
version = "0.1.0"
description = "Pobre Lingo desktop (Tauri 2, Windows)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pobre_lingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
